[branding]
name = "My AI Kit"             # Your kit's display name
short_name = "MY-KIT"          # Uppercase abbreviation
tagline = "AI rules and skills for my team"
watermark = "my-ai-kit"        # Used in file markers (no spaces)
config_dir = ".my-kit"         # Config directory name (starts with .)
# ascii_art_file = "branding/ascii.txt"  # Uncomment to use custom logo

[settings]
default_theme = "Tokyo Night"

[defaults]
rules = true
skills = true
registry = true
profiles = true

